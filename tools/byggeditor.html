<!doctype html>
<html lang="sv"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Byggeditor</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --bg: #f4f2ec; --panel: #fff; --fg: #1f2421; --muted: #6a706b; --line: #ddd8cc; --accent: #2f6b3a; --sel: #1d6fd6; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #1b1f1c; --panel: #252b27; --fg: #e9ece8; --muted: #a2aaa3; --line: #38403a; --accent: #7fc48c; --sel: #5aa2ff; } }
  html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
  #app { display: grid; grid-template-columns: 1fr 370px; height: 100%; }
  @media (max-width: 800px) { #app { grid-template-columns: 1fr; grid-template-rows: 60% 40%; } }
  #map { background: #2a2f2b; }
  #map.drawing { cursor: crosshair; }
  #side { overflow: auto; border-left: 1px solid var(--line); background: var(--panel); padding: 12px 14px; }
  h2 { font-size: 15px; margin: 10px 0 6px; }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; align-items: center; }
  button { padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  button.on { outline: 2px solid var(--sel); }
  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; margin-bottom: 8px; }
  .tabs button.on { background: var(--accent); color: #fff; outline: none; }
  select, input[type=number] { padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  input[type=search] { width: 100%; box-sizing: border-box; padding: 7px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); }
  .item { display: grid; grid-template-columns: 64px 1fr; gap: 8px; padding: 6px; border: 1px solid var(--line); border-radius: 6px; margin: 6px 0; cursor: pointer; }
  .item:hover { border-color: var(--accent); }
  .item img, .item .ph { width: 64px; height: 64px; object-fit: contain; background: #0001; border-radius: 4px; }
  .fit { color: var(--accent); font-weight: 600; }
  pre { white-space: pre-wrap; font-size: 11px; max-height: 260px; overflow: auto; background: var(--bg); padding: 6px; border-radius: 6px; }
  .stats { font-size: 12px; margin-bottom: 4px; }
  .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
  .opbox { background: var(--panel); color: var(--fg); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
  .opbox input { vertical-align: middle; width: 120px; }
  kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; font-size: 11px; }
</style></head>
<body><div id="app"><div id="map"></div><div id="side"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// --- Tillstånd ----------------------------------------------------------------------------------
let D, placed = [], drawings = [], mode = 'bygg';
let selFoot = null, selPlace = null, query = '', hideSmall = true, onlyOpen = false, modFilter = '';
let tool = null, current = null, selDraw = null;            // Måla mark: verktyg, pågående ritning, vald ritning
let areaType = 'gräs', roadType = 'grusväg', roadWidth = 4, treeType = null;
let start = {gard: null, falt: []};   // Start-läget: gårdens mitt, bredd, längd, vridning, byggnader och en punkt per startfält
let freeItem = null;
let dragEnded = 0;
let VE = {flytt: {}, bort: [], nya: []}, selVeh = null, newVeh = null, vehQuery = '';   // Maskiner-läget                    // klicket som följer när man släpper efter en dragning ska inte avmarkera
let overviewLayer = null, groundLayer = null;   // spelets kartbild och marklagren, laddas om efter varje bygge                  // Byggnader: modell som väntar på ett klick i kartan (fri placering)
try { modFilter = localStorage.getItem('byggeditor.mod') || ''; } catch (e) {}
const AREA_TYPES = {'gräs': '#7cc46a', 'åker': '#b98a4e', 'gårdsplan': '#cdbb8e', 'asfaltyta': '#4d5358',
                    'skog': '#2e7d32', 'sudda vägar': '#e53935', 'inga träd': '#ff9800'};
const AREA_HELP = {'gräs': 'gräs, inga fält eller träd', 'åker': 'nytt fält med eget markområde',
                   'gårdsplan': 'grus, inga fält eller träd', 'asfaltyta': 'asfalt, inga fält eller träd',
                   'skog': 'skogsmark och träd', 'sudda vägar': 'tar bort vägar, blir gräs',
                   'inga träd': 'tar bort de automatiska träden, marken ändras inte'};
const ROAD_TYPES = {'grusväg': '#e6d3a1', 'asfaltväg': '#30353a'};

const map = L.map('map', {crs: L.CRS.Simple, minZoom: -4, maxZoom: 4, zoomSnap: 0.25});
const genLayer = L.layerGroup().addTo(map), footLayer = L.layerGroup().addTo(map), drawLayer = L.layerGroup().addTo(map);
const placeLayer = L.layerGroup().addTo(map), treeLayer = L.layerGroup().addTo(map), editLayer = L.layerGroup().addTo(map);
const startLayer = L.layerGroup().addTo(map), vehLayer = L.layerGroup().addTo(map);
const canvas = L.canvas({padding: 0.5});
const side = document.getElementById('side');
const ll = (x, y) => [y, x];   // meter österut/norrut -> Leaflet
const xy = latlng => [Math.round(latlng.lng * 10) / 10, Math.round(latlng.lat * 10) / 10];
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));

// --- Spara --------------------------------------------------------------------------------------
let saveTimer, drawTimer;
function save() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => fetch('api/save', {method: 'POST', body: JSON.stringify(placed)}), 400);
  drawStats();
}
let startTimer;
function saveStart() {
  clearTimeout(startTimer);
  startTimer = setTimeout(() => fetch('api/start', {method: 'POST', body: JSON.stringify(start)}), 300);
}
function saveDrawings() {
  clearTimeout(drawTimer);
  drawTimer = setTimeout(() => fetch('api/drawings', {method: 'POST', body: JSON.stringify(drawings)}), 400);
  drawStats();
}

// --- Byggnader ----------------------------------------------------------------------------------
function corners(p) {           // rot = spelets y-rotation: lokal x (bredd) pekar rot grader moturs från öster
  const r = p.rot * Math.PI / 180, ux = [Math.cos(r), Math.sin(r)], uz = [Math.sin(r), -Math.cos(r)];
  return [[1, 1], [1, -1], [-1, -1], [-1, 1]].map(([a, b]) =>
    ll(p.x + ux[0] * a * p.w / 2 + uz[0] * b * p.l / 2, p.y + ux[1] * a * p.w / 2 + uz[1] * b * p.l / 2));
}
function fit(b, c) {            // lägre = bättre: jämför långsida och kortsida
  const a1 = Math.max(c.width, c.length), a2 = Math.min(c.width, c.length);
  return Math.abs(a1 - b.length) + Math.abs(a2 - b.width);
}
function startRot(b, c) {       // längsta sidan i modellen längs konturens långsida
  return ((c.length >= c.width ? b.angle + 90 : b.angle) + 540) % 360 - 180;
}
function doorOf(file) { return (D.doors && D.doors[file]) || 0; }
function fixDoor(delta) {     // dörren sitter delta grader moturs från pilen: vrid alla av modellen, pilen står kvar
  if (!selPlace) return;
  const file = selPlace.file;
  D.doors[file] = ((doorOf(file) + delta) % 360 + 360) % 360;
  for (const p of placed) if (p.file === file) p.rot = ((p.rot - delta + 540) % 360) - 180;
  fetch('api/doors', {method: 'POST', body: JSON.stringify(D.doors)});
  save(); draw(); panel();
}
function placeOn(b, c) {
  placed = placed.filter(p => p.ref !== b.id);
  const p = {ref: b.id, file: c.path, mod: c.mod, name: c.name, thumb: c.thumb, w: c.width, l: c.length,
             x: b.cx, y: b.cy, rot: startRot(b, c)};
  placed.push(p); selPlace = p; save(); draw(); panel();
}
function rotate(d) { if (!selPlace) return; selPlace.rot = ((selPlace.rot + d + 540) % 360) - 180; save(); draw(); panel(); }
function nudge(dx, dy) {
  if (mode === 'bygg' && selPlace) { selPlace.x += dx; selPlace.y += dy; save(); draw(); }
  if (mode === 'fordon' && selVeh) { moveVeh(selVeh, dx, dy); saveVehicles(); drawVehicles(); }
  if (mode === 'trad' && selDraw && selDraw.kind === 'träd') { selDraw.points[0][0] += dx; selDraw.points[0][1] += dy; saveDrawings(); draw(); }
}
function removePlace() { if (!selPlace) return; placed = placed.filter(p => p !== selPlace); selPlace = null; save(); draw(); panel(); }

// --- Ritningar och träd -------------------------------------------------------------------------
function colorOf(d) { return d.kind === 'väg' ? ROAD_TYPES[d.type] : AREA_TYPES[d.type] || '#fff'; }
function startTool(t) { tool = t; current = null; selDraw = null; draw(); panel(); }
function finishDrawing() {
  if (!current) return;
  const pts = current.points.filter((p, i, a) => i === 0 || Math.hypot(p[0] - a[i - 1][0], p[1] - a[i - 1][1]) > 0.5);
  if ((current.kind === 'yta' && pts.length >= 3) || (current.kind === 'väg' && pts.length >= 2)) {
    current.points = pts; drawings.push(current); selDraw = current; saveDrawings();
  }
  current = null; draw(); panel();
}
function removeDraw() {
  if (!selDraw) return;
  drawings = drawings.filter(d => d !== selDraw); selDraw = null; saveDrawings(); draw(); drawGenerated(); panel();
}
function dragHandle(latlng, onMove, onEnd) {   // flytta något med musen tills knappen släpps
  map.dragging.disable();
  const move = ev => onMove(ev.latlng);
  const up = () => { map.off('mousemove', move); map.off('mouseup', up); map.dragging.enable(); dragEnded = Date.now(); onEnd(); };
  map.on('mousemove', move); map.on('mouseup', up);
}
function treeFill(stage) { return CONIFERS.test(stage || '') ? '#1f6b2c' : '#6cc04a'; }   // barrträd mörka, lövträd ljusa
function treeLabel(type) { const t = D.treeTypes.find(t => t.stage === type); return t ? t.label : type; }

// --- Maskiner -------------------------------------------------------------------------------------
// Startgårdens maskiner (fordon.xml) med ändringarna i VE (se scripts/fordon.py). En grupp är en maskin
// med allt som är kopplat till den; den flyttas och vrids tillsammans runt gruppens första maskin.
let vehTimer;
function saveVehicles() {
  clearTimeout(vehTimer);
  vehTimer = setTimeout(() => fetch('api/vehicles', {method: 'POST', body: JSON.stringify(VE)}), 300);
}
function vehInfo(file) {        // namn och mått ur katalogen, annars filnamnet och 3 × 6 m
  const c = D.vehCat[(file || '').toLowerCase()];
  return c ? {name: c.name + (c.brand ? ' (' + c.brand + ')' : ''), w: c.width || 3, l: c.length || 6, guess: !c.width, thumb: c.thumb}
           : {name: (file || '').split('/').pop().replace('.xml', ''), w: 3, l: 6, guess: true};
}
function vehPlaced() {          // alla maskiner med ändringarna, i kartans koordinater
  const out = [], byId = Object.fromEntries(D.vehicles.map(v => [v.id, v]));
  for (const v of D.vehicles) {
    if (VE.bort.includes(v.id)) continue;
    const e = VE.flytt[v.group], p = byId[v.group] || v;
    let x = v.x, y = v.y, rot = v.rot;
    if (e) {
      const r = e.rot * Math.PI / 180, dx = v.x - p.x, dy = v.y - p.y;
      x = p.x + Math.cos(r) * dx - Math.sin(r) * dy + e.dx; y = p.y + Math.sin(r) * dx + Math.cos(r) * dy + e.dy;
      rot = v.rot + e.rot;
    }
    out.push({key: {group: v.group}, x, y, rot, ...vehInfo(v.file)});
  }
  VE.nya.forEach((n, i) => out.push({key: {ny: i}, x: n.x, y: n.y, rot: n.rot, ...vehInfo(n.file), name: n.name || vehInfo(n.file).name}));
  return out;
}
function sameVeh(a, b) { return a && b && (a.group !== undefined ? a.group === b.group : a.ny === b.ny); }
function moveVeh(key, ddx, ddy) {
  if (key.ny !== undefined) { VE.nya[key.ny].x += ddx; VE.nya[key.ny].y += ddy; }
  else { const e = VE.flytt[key.group] || (VE.flytt[key.group] = {dx: 0, dy: 0, rot: 0}); e.dx += ddx; e.dy += ddy; }
}
function rotateVeh(d) {
  if (!selVeh) return;
  if (selVeh.ny !== undefined) VE.nya[selVeh.ny].rot = ((VE.nya[selVeh.ny].rot + d + 540) % 360) - 180;
  else { const e = VE.flytt[selVeh.group] || (VE.flytt[selVeh.group] = {dx: 0, dy: 0, rot: 0}); e.rot = ((e.rot + d + 540) % 360) - 180; }
  saveVehicles(); drawVehicles(); panel();
}
function removeVeh() {
  if (!selVeh) return;
  if (selVeh.ny !== undefined) VE.nya.splice(selVeh.ny, 1);
  else { for (const v of D.vehicles) if (v.group === selVeh.group) VE.bort.push(v.id); delete VE.flytt[selVeh.group]; }
  selVeh = null; saveVehicles(); drawVehicles(); panel();
}
function drawVehicles() {
  vehLayer.clearLayers();
  for (const v of vehPlaced()) {
    const sel = sameVeh(v.key, selVeh), p = {x: v.x, y: v.y, w: v.w, l: v.l, rot: v.rot};
    const poly = L.polygon(corners(p), {color: sel ? '#1d6fd6' : '#20304a', weight: sel ? 3 : 1.5, fillColor: '#e8c33a',
      fillOpacity: 0.8, dashArray: v.guess ? '4 3' : null, interactive: mode === 'fordon'})
      .bindTooltip(v.name + (v.guess ? ' (mått okända)' : ''), {sticky: true}).addTo(vehLayer);
    const r = v.rot * Math.PI / 180, tip = [v.x + Math.sin(r) * (v.l / 2 + 1.5), v.y - Math.cos(r) * (v.l / 2 + 1.5)];
    L.polyline([ll(v.x, v.y), ll(...tip)], {color: '#c62828', weight: 3, interactive: false}).addTo(vehLayer);
    poly.on('click', L.DomEvent.stop);
    poly.on('mousedown', e => {
      L.DomEvent.stop(e); selVeh = v.key; tool = null;
      let last = e.latlng;
      dragHandle(e.latlng, ln => { moveVeh(v.key, ln.lng - last.lng, ln.lat - last.lat); last = ln; drawVehicles(); },
                 () => { saveVehicles(); drawVehicles(); panel(); });
      drawVehicles(); panel();
    });
  }
}
function vehCatalogList() {
  const words = vehQuery.toLowerCase().split(/\s+/).filter(Boolean);
  const list = D.vehicleCatalog.filter(c => words.every(w => (c.name + ' ' + (c.brand || '') + ' ' + (c.category || '') + ' '
    + (c.mod || '')).toLowerCase().includes(w))).slice(0, 80);
  return list.map(c => `<div class="item" data-v="${D.vehicleCatalog.indexOf(c)}">
      ${c.thumb ? `<img src="fimg/${c.thumb.split('/').pop()}" loading="lazy" alt="">` : '<div class="ph"></div>'}
      <div><b>${esc(c.name)}</b>${c.brand ? ' · ' + esc(c.brand) : ''}<br>
      <span class="fit">${c.width ? c.width + ' × ' + c.length + ' m' : 'mått saknas'}</span><br>
      <span class="muted">${esc(c.mod || 'spelet')} · ${esc(c.category || '')}</span></div></div>`).join('')
    || '<p class="muted">Inga träffar. Kör fordon_katalog.py om katalogen är tom.</p>';
}
function panelFordon() {
  const placedV = vehPlaced();
  let h = `<h2>Startgårdens maskiner</h2><p class="muted">${placedV.length} maskiner. Dra en maskin för att flytta den
    (påkopplade redskap följer med), <kbd>Q</kbd>/<kbd>E</kbd> vrider (med <kbd>Shift</kbd> 15°), <kbd>Delete</kbd> tar bort.
    Den röda pilen visar fronten. Streckade rutor har okända mått. Höjden räknas om vid bygget.</p>`;
  if (selVeh) {
    const members = selVeh.ny !== undefined ? [VE.nya[selVeh.ny]] : D.vehicles.filter(v => v.group === selVeh.group);
    h += `<h2>Vald</h2><div>${members.map(m => esc(vehInfo(m.file).name)).join('<br>')}</div>
      <div class="row"><button data-vr="-15">↺ 15°</button><button data-vr="-1">↺ 1°</button><button data-vr="1">↻ 1°</button>
      <button data-vr="15">↻ 15°</button><button data-vr="180">Vänd 180°</button></div>
      <div class="row"><button id="vdel">Ta bort</button>${selVeh.group !== undefined && VE.flytt[selVeh.group]
        ? '<button id="vreset">Tillbaka till sparfilens plats</button>' : ''}</div>`;
  }
  h += `<h2>Lägg till maskin</h2><p class="muted">${tool === 'nyfordon' && newVeh ? `Klicka i kartan där <b>${esc(newVeh.name)}</b>
    ska stå (<kbd>Esc</kbd> avbryter).` : 'Välj en maskin och klicka i kartan. Nya maskiner är ett test: säg till hur de ser ut i spelet.'}</p>
    <input type="search" id="vq" placeholder="Sök maskin, märke eller kategori …" value="${esc(vehQuery)}">
    <div id="vlist">${vehCatalogList()}</div>`;
  if (VE.bort.length) h += `<p class="muted">${VE.bort.length} borttagna maskiner. <button id="vundo">Ångra borttagningar</button></p>`;
  return h;
}

// --- Startgård och startfält ----------------------------------------------------------------------
function inside(pt, poly) {      // punkt i polygon (strålmetoden)
  let c = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const [xi, yi] = poly[i], [xj, yj] = poly[j];
    if ((yi > pt[1]) !== (yj > pt[1]) && pt[0] < (xj - xi) * (pt[1] - yi) / (yj - yi) + xi) c = !c;
  }
  return c;
}
function isStart(f) { return start.falt.some(p => inside(p, f.poly)); }
function toggleField(f, latlng) {
  if (isStart(f)) start.falt = start.falt.filter(p => !inside(p, f.poly));
  else start.falt.push(xy(latlng));
  saveStart(); draw(); panel();
}
function farmCorners(x, y) {     // bredden längs vridningen (grader moturs från öster), som i build_map.Site
  const r = start.vridning * Math.PI / 180, w = start.bredd / 2, l = start.langd / 2;
  return [[1, 1], [-1, 1], [-1, -1], [1, -1]].map(([a, b]) =>
    ll(x + a * w * Math.cos(r) - b * l * Math.sin(r), y + a * w * Math.sin(r) + b * l * Math.cos(r)));
}
function rotateFarm(d) { if (!start.gard) return; start.vridning = ((start.vridning + d + 540) % 360) - 180; saveStart(); draw(); panel(); }
function drawStart() {
  startLayer.clearLayers();
  const own = start.falt.length > 0;
  for (const f of mode === 'start' ? D.fields : []) {        // fälten bara i Start-läget, gården alltid
    const sel = own ? isStart(f) : f.start;
    const poly = L.polygon(f.poly.map(p => ll(...p)), {color: sel ? '#e53935' : '#ffb347', weight: sel ? 2.5 : 1,
      dashArray: sel && !own ? '5 4' : null, fillColor: '#e53935', fillOpacity: sel ? 0.35 : 0.04,
      interactive: mode === 'start'}).bindTooltip(`Fält ${f.nr}: ${f.fruit}, ${f.ha} ha`, {sticky: true}).addTo(startLayer);
    poly.on('click', e => { L.DomEvent.stop(e); if (tool === 'gard') map.fire('click', {latlng: e.latlng}); else toggleField(f, e.latlng); });
  }
  if (start.gard) {
    const sq = L.polygon(farmCorners(...start.gard), {color: '#ffd400', weight: 3, fillColor: '#ffd400',
      fillOpacity: mode === 'start' ? 0.25 : 0.08, interactive: mode === 'start'})
      .bindTooltip('Startgårdens gårdsplan (dra för att flytta)', {sticky: true}).addTo(startLayer);
    sq.on('click', L.DomEvent.stop);
    sq.on('mousedown', e => {
      L.DomEvent.stop(e);
      const s0 = e.latlng, g0 = [...start.gard];
      dragHandle(s0, ln => { start.gard = [Math.round(g0[0] + ln.lng - s0.lng), Math.round(g0[1] + ln.lat - s0.lat)];
                             sq.setLatLngs(farmCorners(...start.gard)); }, () => { saveStart(); panel(); });
    });
  }
}

// --- Rita kartan --------------------------------------------------------------------------------
function draw() {
  drawStart();
  footLayer.clearLayers(); placeLayer.clearLayers(); drawLayer.clearLayers(); treeLayer.clearLayers(); editLayer.clearLayers();
  const done = new Set(placed.map(p => p.ref));
  for (const b of D.buildings) {
    if (hideSmall && b.area < 30) continue;
    if (onlyOpen && done.has(b.id)) continue;
    const isSel = selFoot && selFoot.id === b.id;
    const poly = L.polygon(b.poly.map(([x, y]) => ll(x, y)), {color: isSel ? '#ffd400' : done.has(b.id) ? '#3fd16b' : '#ff4b4b',
      weight: isSel ? 3 : 1.5, fillOpacity: 0.08, interactive: mode === 'bygg'}).addTo(footLayer);
    poly.on('click', e => { L.DomEvent.stop(e); selFoot = b; selPlace = placed.find(p => p.ref === b.id) || null; draw(); panel(); });
  }
  for (const d of drawings) {
    if (d.kind === 'träd') continue;
    const isSel = d === selDraw, c = colorOf(d), dash = (d.type === 'sudda vägar' || d.type === 'inga träd') ? '6 4' : null;
    const opts = {color: isSel ? '#1d6fd6' : c, weight: isSel ? 3 : 2, dashArray: dash, interactive: mode === 'mala'};
    const shape = d.kind === 'yta'
      ? L.polygon(d.points.map(p => ll(...p)), {...opts, fillColor: c, fillOpacity: 0.35})
      : L.polyline(d.points.map(p => ll(...p)), {...opts, color: isSel ? '#1d6fd6' : c, weight: Math.max(4, d.width * 1.2), opacity: 0.9});
    shape.bindTooltip(d.type + (d.kind === 'väg' ? `, ${d.width} m` : ''), {sticky: true}).addTo(drawLayer);
    shape.on('click', e => {
      L.DomEvent.stop(e);
      if (tool) { map.fire('click', {latlng: e.latlng}); return; }   // ritar man vidare ovanpå en annan yta
      selDraw = d; draw(); panel();
    });
  }
  if (selDraw && selDraw.kind !== 'träd' && mode === 'mala') {     // flyttbara hörn
    selDraw.points.forEach((p, i) => {
      L.circleMarker(ll(...p), {radius: 6, color: '#1d6fd6', fillColor: '#fff', fillOpacity: 1, weight: 2}).addTo(editLayer)
        .on('mousedown', e => { L.DomEvent.stop(e); dragHandle(e.latlng, ln => { selDraw.points[i] = xy(ln); draw(); }, () => { saveDrawings(); }); })
        .on('click', L.DomEvent.stop);
    });
  }
  if (current) {
    const pts = current.points.map(p => ll(...p));
    (current.kind === 'yta' ? L.polygon(pts, {color: '#1d6fd6', dashArray: '4 4', fillOpacity: 0.15, interactive: false})
                            : L.polyline(pts, {color: '#1d6fd6', dashArray: '4 4', interactive: false})).addTo(editLayer);
    pts.forEach(p => L.circleMarker(p, {radius: 4, color: '#1d6fd6', interactive: false}).addTo(editLayer));
  }
  for (const d of drawings) {
    if (d.kind !== 'träd') continue;
    const isSel = d === selDraw;
    // samma storlek i meter som träden från bygget, med blå kant när det är valt
    const m = L.circle(ll(...d.points[0]), {radius: genRadius(d.type), color: isSel ? '#1d6fd6' : '#0b3d0b',
      weight: isSel ? 3 : 1.5, fillColor: treeFill(d.type), fillOpacity: 0.9, interactive: mode === 'trad'})
      .bindTooltip(treeLabel(d.type) + ' (utsatt)', {sticky: true}).addTo(treeLayer);
    m.on('click', L.DomEvent.stop);
    m.on('mousedown', e => {
      L.DomEvent.stop(e); selDraw = d; tool = null;
      dragHandle(e.latlng, ln => { d.points[0] = xy(ln); m.setLatLng(ln); }, () => { saveDrawings(); draw(); panel(); });
    });
  }
  for (const p of placed) {
    const isSel = p === selPlace;
    const poly = L.polygon(corners(p), {color: isSel ? '#1d6fd6' : '#3a8dde', weight: isSel ? 3 : 1.5, fillOpacity: 0.35,
      interactive: mode === 'bygg'}).bindTooltip(p.name, {sticky: true}).addTo(placeLayer);
    poly.on('click', L.DomEvent.stop);
    poly.on('mousedown', e => {
      L.DomEvent.stop(e); selPlace = p; selFoot = D.buildings.find(b => b.id === p.ref) || null;
      const start = e.latlng, x0 = p.x, y0 = p.y;
      dragHandle(start, ln => { p.x = x0 + ln.lng - start.lng; p.y = y0 + ln.lat - start.lat; poly.setLatLngs(corners(p)); },
                 () => { save(); draw(); panel(); });
    });
    // Pil mot dörren: modellens lokala +z vriden med dörrsidan för modellen (doorOf)
    const r = (p.rot + doorOf(p.file)) * Math.PI / 180, ax = Math.sin(r), ay = -Math.cos(r);
    const tip = [p.x + ax * (p.l / 2 + 3), p.y + ay * (p.l / 2 + 3)];
    L.polyline([ll(p.x, p.y), ll(...tip)], {color: '#ffd400', weight: 3, interactive: false}).addTo(placeLayer);
    L.circleMarker(ll(...tip), {radius: 4, color: '#ffd400', fillOpacity: 1, interactive: false}).addTo(placeLayer);
  }
  document.getElementById('map').classList.toggle('drawing', !!tool);
}
const CONIFERS = /^(spruce|pinus|lodgepole)/;
function genRadius(stage) { const m = /stage0*(\d+)/.exec(stage || ''); return 1.5 + (m ? +m[1] : 3) * 0.9; }   // meter
function noTreeAreas() { return drawings.filter(d => d.kind === 'yta' && d.type === 'inga träd'); }
function removeGenTree(x, y) {   // ett litet "inga träd"-område på 3 × 3 m tar bort trädet vid nästa bygge
  const h = 1.5, d = {kind: 'yta', type: 'inga träd', points: [[x - h, y - h], [x + h, y - h], [x + h, y + h], [x - h, y + h]]};
  drawings.push(d); saveDrawings(); drawGenerated(); draw();
}
function adoptGenTree(x, y, stage) {   // ett träd från bygget blir ett utsatt träd som går att flytta och byta
  const h = 1.5;
  drawings.push({kind: 'yta', type: 'inga träd', points: [[x - h, y - h], [x + h, y - h], [x + h, y + h], [x - h, y + h]]});
  const d = {kind: 'träd', type: stage, art: stage.split('_')[0], points: [[x, y]]};
  drawings.push(d); selDraw = d; tool = null;
  return d;
}
function drawGenerated() {     // träden från senaste bygget: barrträd mörkgröna, lövträd ljusgröna, storlek efter ålder
  genLayer.clearLayers();
  const gone = noTreeAreas();
  for (const [x, y, stage] of D.genTrees) {
    if (gone.some(a => inside([x, y], a.points))) continue;
    const c = L.circle(ll(x, y), {renderer: canvas, radius: genRadius(stage), weight: 1, color: '#0d2a10',
      fillColor: treeFill(stage), fillOpacity: 0.85, interactive: mode === 'trad'})
      .bindTooltip(treeLabel(stage) || 'träd', {sticky: true}).addTo(genLayer);
    c.on('click', L.DomEvent.stop);
    c.on('mousedown', e => {
      L.DomEvent.stop(e);
      if (tool === 'tabort') { removeGenTree(x, y); return; }
      if (tool || !stage) return;
      const d = adoptGenTree(x, y, stage);                // dra direkt, eller klicka för att byta art
      const m = L.circle(ll(x, y), {radius: genRadius(stage), color: '#1d6fd6', weight: 3, fillColor: treeFill(stage),
        fillOpacity: 0.9, interactive: false}).addTo(editLayer);
      drawGenerated();
      dragHandle(e.latlng, ln => { d.points[0] = xy(ln); m.setLatLng(ln); }, () => { saveDrawings(); draw(); panel(); });
    });
  }
}
function drawStats() {
  const el = document.getElementById('stats');
  if (!el) return;

  el.textContent = `${placed.length} byggnader, ${drawings.length - nt} ritade ytor och vägar, ${nt} utsatta träd`;
}

function modOptions() {
  const counts = {};
  for (const c of D.catalog) counts[c.mod] = (counts[c.mod] || 0) + 1;
  if (modFilter && !counts[modFilter]) modFilter = '';
  return `<option value="">Alla moddar (${D.catalog.length})</option>` + Object.keys(counts).sort()
    .map(m => `<option value="${esc(m)}" ${m === modFilter ? 'selected' : ''}>${esc(m)} (${counts[m]})</option>`).join('');
}
function catalogList(b) {
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const list = D.catalog.filter(c => (!modFilter || c.mod === modFilter)
      && words.every(w => (c.name + ' ' + c.mod + ' ' + c.category + ' ' + c.file).toLowerCase().includes(w)))
    .map(c => ({c, s: b ? fit(b, c) + (c.guess ? 1000 : 0) : 0}))   // utan mått sist

}
function bindList() {
  side.querySelectorAll('.item').forEach(el => el.onclick = () => {
    const c = D.catalog[+el.dataset.i];
    if (selFoot) placeOn(selFoot, c);
    else { freeItem = c; tool = 'fri'; draw(); panel(); }
  });
}

// --- Bygga kartan -------------------------------------------------------------------------------
let building = false, buildLog = '';
function showBuild() {
  const el = document.getElementById('log'), btn = document.getElementById('build');
  if (el) { el.hidden = !buildLog; el.textContent = buildLog; el.scrollTop = 1e9; }
  if (btn) { btn.disabled = building; btn.textContent = building ? 'Bygger …' : 'Bygg kartan'; }
}
async function startBuild() {
  building = true; buildLog = 'Sparar och startar bygget. Det tar en till två minuter …\n'; showBuild();
  try {
    await fetch('api/save', {method: 'POST', body: JSON.stringify(placed)});
    await fetch('api/drawings', {method: 'POST', body: JSON.stringify(drawings)});
    await fetch('api/start', {method: 'POST', body: JSON.stringify(start)});
    await fetch('api/vehicles', {method: 'POST', body: JSON.stringify(VE)});
    const r = await fetch('api/build', {method: 'POST'});
    if (!r.ok) buildLog += 'Ett bygge pågår redan, visar dess logg.\n';
  } catch (e) {
    building = false; buildLog += 'Kunde inte nå servern: ' + e + '\n'; showBuild(); return;
  }
  const poll = async () => {
    try {
      const s = await (await fetch('api/build')).json();
      building = s.running; buildLog = s.log || buildLog;
    } catch (e) { buildLog += '.'; }
    showBuild();
    if (building) setTimeout(poll, 1500);
    else fetch('api/data').then(r => r.json()).then(d => {
      D.genTrees = d.genTrees; D.fields = d.fields || []; drawGenerated(); draw(); panel();
      if (overviewLayer) overviewLayer.setUrl('bg/overview.png?v=' + Date.now());   // nya kartbilden
      if (groundLayer) groundLayer.setUrl('bg/marklager.png?v=' + Date.now());
    });
  };
  setTimeout(poll, 800);
}

// --- Mus och tangentbord ------------------------------------------------------------------------
map.on('click', e => {
  if (Date.now() - dragEnded < 400) return;
  if (mode === 'bygg' && tool === 'fri' && freeItem) {     // fri placering, vriden som gårdsplanen
    const [x, y] = xy(e.latlng), c = freeItem;
    placeOn({id: 'fri-' + Date.now(), cx: x, cy: y, angle: start.gard ? (start.vridning + 180) % 180 : 0,
             length: Math.max(c.width, c.length), width: Math.min(c.width, c.length)}, c);
    tool = null; freeItem = null; draw(); panel(); return;
  }
  if (mode === 'fordon' && tool === 'nyfordon' && newVeh) {
    const [x, y] = xy(e.latlng);
    VE.nya.push({file: newVeh.file, mod: newVeh.mod || null, name: newVeh.name, x, y, rot: 0});
    selVeh = {ny: VE.nya.length - 1}; tool = null; newVeh = null; saveVehicles(); drawVehicles(); panel(); return;
  }
  if (mode === 'start' && tool === 'gard') {
    start.gard = xy(e.latlng).map(Math.round); tool = null; saveStart(); draw(); panel(); return;
  }
  if (mode === 'mala' && (tool === 'yta' || tool === 'väg')) {
    if (!current) current = tool === 'yta' ? {kind: 'yta', type: areaType, points: []}
                                           : {kind: 'väg', type: roadType, width: roadWidth, points: []};
    current.points.push(xy(e.latlng)); draw(); return;
  }
  if (mode === 'trad' && tool === 'träd' && treeType) {
    const t = D.treeTypes.find(t => t.stage === treeType);
    const d = {kind: 'träd', type: t.stage, art: t.art, points: [xy(e.latlng)]};
    drawings.push(d); selDraw = d; saveDrawings(); draw(); panel(); return;
  }
  selFoot = selPlace = selDraw = null;
  if (selVeh) { selVeh = null; drawVehicles(); }
  draw(); panel();
});
map.on('dblclick', () => { if (current) { finishDrawing(); tool = null; map.doubleClickZoom.enable(); panel(); } });
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const k = e.key, big = e.shiftKey;
  if (current) {
    if (k === 'Enter') { finishDrawing(); tool = null; map.doubleClickZoom.enable(); panel(); }
    else if (k === 'Backspace') { current.points.pop(); draw(); }
    else if (k === 'Escape') { current = null; tool = null; map.doubleClickZoom.enable(); draw(); panel(); }
    else return;
    e.preventDefault(); return;
  }
  if (k === 'ArrowLeft') nudge(big ? -2 : -0.5, 0);
  else if (k === 'ArrowRight') nudge(big ? 2 : 0.5, 0);
  else if (k === 'ArrowUp') nudge(0, big ? 2 : 0.5);
  else if (k === 'ArrowDown') nudge(0, big ? -2 : -0.5);
  else if (k === 'Delete' || k === 'Backspace') { if (mode === 'bygg') removePlace(); else if (mode === 'fordon') removeVeh(); else removeDraw(); }
  else if (mode === 'bygg' && (k === 'q' || k === 'Q')) rotate(big ? -15 : -1);
  else if (mode === 'bygg' && (k === 'e' || k === 'E')) rotate(big ? 15 : 1);
  else if (mode === 'bygg' && (k === 'f' || k === 'F')) rotate(180);
  else if (mode === 'start' && (k === 'q' || k === 'Q')) rotateFarm(big ? -15 : -1);
  else if (mode === 'fordon' && (k === 'q' || k === 'Q')) rotateVeh(big ? -15 : -1);
  else if (mode === 'fordon' && (k === 'e' || k === 'E')) rotateVeh(big ? 15 : 1);
  else if (mode === 'start' && (k === 'e' || k === 'E')) rotateFarm(big ? 15 : 1);
  else if (k === 'Escape') { selFoot = selPlace = selDraw = selVeh = newVeh = null; tool = null; draw(); drawVehicles(); panel(); }
  else return;
  e.preventDefault();
});

fetch('api/data').then(r => r.json()).then(d => {
  D = d; placed = d.placed || []; drawings = d.drawings || []; D.doors = d.doors || {};
  D.genTrees = d.genTrees || []; D.treeTypes = d.treeTypes || []; D.fields = d.fields || []; D.farmSize = d.farmSize || 100;
  D.vehicles = d.vehicles || []; D.vehicleCatalog = d.vehicleCatalog || [];
  D.vehCat = Object.fromEntries(D.vehicleCatalog.map(c => [c.file.toLowerCase(), c]));
  VE = Object.assign({flytt: {}, bort: [], nya: []}, d.vehicleEdits || {});
  const s0 = d.start || {};
  start = {gard: s0.gard || null, falt: s0.falt || [], bredd: s0.bredd || D.farmSize, langd: s0.langd || D.farmSize,
           vridning: s0.vridning || 0, byggnader: s0.byggnader !== false, plana: s0.plana !== false};
  D.catalog.forEach(c => { if (c.thumb) c.thumb = 'img/' + c.thumb.split('/').pop(); });
  // Bakgrund: spelets kartbild (från senaste bygget) eller ortofotot. Ortofotot kan också ligga
  // genomskinligt ovanpå spelets karta som stöd när man målar. Båda under det som ritas.
  map.createPane('bakgrund').style.zIndex = 250;
  map.createPane('stod').style.zIndex = 260;
  const bounds = bg => [[-bg.half, -bg.half], [bg.half, bg.half]];
  const ov = D.backgrounds.find(b => b.file.includes('overview')), ortho = D.backgrounds.find(b => b.file.includes('ortofoto'));
  const ml = D.backgrounds.find(b => b.file.includes('marklager'));
  const bases = {};
  if (ml) bases['Marklager (tydliga kanter)'] = groundLayer = L.imageOverlay(ml.file + '?v=' + Date.now(), bounds(ml), {pane: 'bakgrund'});
  if (ov) bases['Spelets karta'] = overviewLayer = L.imageOverlay(ov.file + '?v=' + Date.now(), bounds(ov), {pane: 'bakgrund'});
  if (ortho) bases['Ortofoto'] = L.imageOverlay(ortho.file, bounds(ortho), {pane: 'bakgrund'});
  bases['Ingen bakgrund'] = L.layerGroup();
  Object.values(bases)[0].addTo(map);
  const overlays = {};
  if (ortho && (ov || ml)) {
    let op = 0.4;
    try { op = parseFloat(localStorage.getItem('byggeditor.ortoop') || '0.4'); } catch (e) {}
    const orthoOver = L.imageOverlay(ortho.file, bounds(ortho), {pane: 'stod', opacity: op});
    overlays['Ortofoto genomskinligt'] = orthoOver;
    try { if (localStorage.getItem('byggeditor.orto') !== 'av') orthoOver.addTo(map); } catch (e) { orthoOver.addTo(map); }
    map.on('overlayadd overlayremove', e => {
      if (e.layer === orthoOver) try { localStorage.setItem('byggeditor.orto', e.type === 'overlayadd' ? 'på' : 'av'); } catch (err) {}
    });
    const ctl = L.control({position: 'bottomleft'});
    ctl.onAdd = () => {
      const div = L.DomUtil.create('div', 'opbox');
      div.innerHTML = `ortofoto <input type="range" min="0" max="100" value="${Math.round(op * 100)}">`;
      L.DomEvent.disableClickPropagation(div);
      div.querySelector('input').oninput = ev => {
        orthoOver.setOpacity(ev.target.value / 100);
        try { localStorage.setItem('byggeditor.ortoop', ev.target.value / 100); } catch (err) {}
      };
      return div;
    };
    ctl.addTo(map);
  }
  Object.assign(overlays, {'Verkliga byggnader': footLayer, 'Ritade ytor och vägar': drawLayer,
    'Placerade byggnader': placeLayer, 'Utsatta träd': treeLayer, 'Träd från senaste bygget': genLayer, 'Maskiner': vehLayer,
    'Fält och startgård': startLayer});
  L.control.layers(bases, overlays, {collapsed: false}).addTo(map);
  L.rectangle([[-D.half, -D.half], [D.half, D.half]], {color: '#fff', weight: 1, dashArray: '6 4', fill: false, interactive: false}).addTo(map);
  map.fitBounds([[-D.half, -D.half], [D.half, D.half]]);
  draw(); drawGenerated(); drawVehicles(); panel();
});
</script></body></html>
